	[medals.iron_medal]
		#The medal protect pet from his owner's damages
		protect_from_owner = true
		#The medal protect pet from players of his owner's team if PVP is turned off
		protect_from_team = false
		#Allow the medal to create a resurrection pearl in anvil
		allow_resurrection = false
		#Display the medal on the pet
		render_on_pet = true

	[medals.gold_medal]
		#The medal protect pet from his owner's damages
		protect_from_owner = true
		#The medal protect pet from players of his owner's team if PVP is turned off
		protect_from_team = true
		#Allow the medal to create a resurrection pearl in anvil
		allow_resurrection = false
		#Display the medal on the pet
		render_on_pet = true

	[medals.diamond_medal]
		#The medal protect pet from his owner's damages
		protect_from_owner = true
		#The medal protect pet from players of his owner's team if PVP is turned off
		protect_from_team = true
		#Allow the medal to create a resurrection pearl in anvil
		allow_resurrection = true
		#Display the medal on the pet
		render_on_pet = true
